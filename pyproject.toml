[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "research-code-quality"
version = "0.2.0"
description = "Shared static-analysis algorithm for research-workspace maintainability metric scripts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tomli>=2; python_version < '3.11'",
]

[project.scripts]
research-code-quality = "research_code_quality.scanner:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["research_code_quality", "research_code_quality.*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "RET", "SIM", "RUF"]

[tool.ruff.lint.isort]
combine-as-imports = true
