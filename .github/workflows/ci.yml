name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Install locked development dependencies
        run: uv sync --locked --extra dev

      - name: Run Ruff checks
        run: uv run --locked --extra dev ruff check .

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Run repository scanner
        run: >-
          uv run --locked --extra dev python -m research_code_quality.scanner
          --scope research_code_quality --scope tests --json
